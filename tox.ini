[tox]
envlist=py39,py310,py311,py312,py313,py314,linting

[testenv]
extras=tests
commands=py.test {posargs}

[testenv:linting]
skipsdist = True
usedevelop = True
basepython = python3
deps = pre-commit
commands = pre-commit run --all-files

[flake8]
max-line-length = 88
ignore = E401,E722,W503,F821,E501,E203
